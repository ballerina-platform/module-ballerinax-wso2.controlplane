# ballerina:13 (config.bal, types.bal): these match configurable defaults named *Password. keyStorePassword and
# trustStorePassword default to "ballerina", the publicly documented password of the keystore/truststore bundled with
# the Ballerina distribution (the default paths point to those files); they are overridable configurables.
# serviceAccountPassword ("bal_secret") is a overridable configurable default of the DashBoard config record; making
# these mandatory would change the configuration contract of the package.
# ballerina:14 (icpService.bal, security.bal): flags `AccessToken: ...generateJwtToken()` and the `password` variable
# destructured from the decoded Authorization header at runtime. Both are runtime values, not fixed secrets.
# TODO: replace this rule exclusion with a targeted scan suppression (with a reason) once `bal scan` supports it
# (planned for v0.13.0), and fix the false positives on the scan tool side: a secret-named identifier should only be
# reported when it is assigned a fixed value.
[rule]
exclude = ["ballerina:13", "ballerina:14"]
